<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1024 1024"
  fill="none"
  aria-label="Defne Avatar Illustration in Red Circle"
>
  <style>
    .avatar-solid-circle {
      fill: #FF2D20;
    }
    .avatar-base-white {
      fill: #ffffff;
      opacity: 1;
    }

    @keyframes avatarEyeBlink {
      0%, 94%, 98%, 100% {
        transform: scaleY(1);
      }
      96% {
        transform: scaleY(0.1);
      }
    }
    .avatar-eye {
      transform-origin: 50% 420px;
      animation: avatarEyeBlink 4.6s infinite ease-in-out;
    }
  </style>

  <defs>
    <clipPath id="avatar-circular-boundary">
      <circle cx="512" cy="470" r="430" />
    </clipPath>
  </defs>

  <g clipPath="url(#avatar-circular-boundary)">
    <circle
      cx="512"
      cy="470"
      r="430"
      class="avatar-solid-circle"
    />

    <g class="avatar-layer-doodles" fill="#ffffff">
      <path d="M 210 240 Q 220 220 230 240 Q 250 250 230 260 Q 220 280 210 260 Q 190 250 210 240 Z" opacity="0.9" />
      <circle cx="170" cy="310" r="10" opacity="0.8" />
      <circle cx="260" cy="180" r="7" opacity="0.8" />
      <path d="M 240 330 C 260 310, 290 320, 280 340 C 270 360, 240 350, 260 380" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8" />

      <path d="M 810 240 Q 820 220 830 240 Q 850 250 830 260 Q 820 280 810 260 Q 790 250 810 240 Z" opacity="0.9" />
      <circle cx="850" cy="310" r="12" opacity="0.8" />
      <circle cx="760" cy="180" r="8" opacity="0.8" />
      <path d="M 770 330 C 750 310, 720 320, 730 340 C 740 360, 770 350, 750 380" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8" />

      <circle cx="160" cy="620" r="9" opacity="0.75" />
      <circle cx="860" cy="620" r="9" opacity="0.75" />
    </g>

    <path
      d="M 512 160 C 370 160, 230 240, 210 430 C 190 620, 220 780, 260 920 L 764 920 C 804 780, 834 620, 814 430 C 794 240, 654 160, 512 160 Z"
      class="avatar-base-white"
    />

    <g class="avatar-layer-garment">
      <path d="M 230 720 L 370 690 L 320 950 Z" fill="#111118" />
      <circle cx="280" cy="780" r="8" fill="#ffffff" />
      <circle cx="280" cy="840" r="8" fill="#ffffff" />

      <path d="M 794 720 L 654 690 L 704 950 Z" fill="#111118" />
      <circle cx="744" cy="780" r="8" fill="#ffffff" />
      <circle cx="744" cy="840" r="8" fill="#ffffff" />

      <path d="M 412 560 L 412 650 Q 512 680 612 650 L 612 560 Z" fill="#ffffff" stroke="#111118" stroke-width="10" stroke-linejoin="round" />
      <path d="M 432 600 Q 512 625 592 600" stroke="#111118" stroke-width="6" fill="none" stroke-dasharray="6 8" />

      <path d="M 370 690 L 512 830 L 654 690" stroke="#111118" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 395 690 L 512 800 L 629 690" stroke="#111118" stroke-width="6" fill="none" stroke-dasharray="8 8" />
      
      <path d="M 452 700 C 482 780, 492 820, 502 870" stroke="#111118" stroke-width="5" fill="none" stroke-dasharray="6 6" />
    </g>

    <g class="avatar-layer-skin">
      <path d="M 425 560 L 425 640 Q 512 660 599 640 L 599 560" stroke="#111118" stroke-width="10" fill="#ffffff" />
      <path d="M 360 380 C 360 510, 400 595, 512 595 C 624 595, 664 510, 664 380" fill="#ffffff" stroke="#111118" stroke-width="12" stroke-linecap="round" />
    </g>

    <g class="avatar-layer-hair" fill="#111118" stroke="#111118" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 512 170 L 512 245" stroke-width="8" />

      <path d="M 512 175 C 430 170, 360 200, 305 260 C 275 295, 250 345, 235 400" stroke-width="12" fill="none" />
      <path d="M 512 175 C 594 170, 664 200, 719 260 C 749 295, 774 345, 789 400" stroke-width="12" fill="none" />

      <path d="M 495 190 C 450 195, 410 220, 370 260 M 475 210 C 435 225, 395 255, 365 300" stroke-width="7" fill="none" />
      <path d="M 529 190 C 574 195, 614 220, 654 260 M 549 210 C 589 225, 629 255, 659 300" stroke-width="7" fill="none" />

      <path d="M 235 380 C 195 440, 185 520, 215 585 C 240 635, 290 655, 310 595 C 330 535, 285 485, 305 415" stroke-width="11" fill="#111118" fill-opacity="0.1" />
      <path d="M 215 440 C 175 500, 195 590, 245 630 C 280 655, 320 625, 300 570" stroke-width="8" fill="none" />
      <path d="M 255 530 C 220 580, 240 645, 275 660 C 305 670, 320 635, 310 595" stroke-width="7" fill="none" />

      <path d="M 789 380 C 829 440, 839 520, 809 585 C 784 635, 734 655, 714 595 C 694 535, 739 485, 719 415" stroke-width="11" fill="#111118" fill-opacity="0.1" />
      <path d="M 809 440 C 849 500, 829 590, 779 630 C 744 655, 704 625, 724 570" stroke-width="8" fill="none" />
      <path d="M 769 530 C 804 580, 784 645, 749 660 C 719 670, 704 635, 714 595" stroke-width="7" fill="none" />

      <path d="M 505 245 C 465 285, 425 295, 395 270" stroke-width="7" fill="none" />
      <path d="M 519 245 C 559 285, 599 295, 629 270" stroke-width="7" fill="none" />
    </g>

    <g class="avatar-layer-glasses" fill="none" stroke="#111118" stroke-linecap="round" stroke-linejoin="round">
      <rect x="330" y="365" width="145" height="110" rx="42" ry="42" stroke-width="13" fill="#ffffff" fill-opacity="0.1" />
      <rect x="549" y="365" width="145" height="110" rx="42" ry="42" stroke-width="13" fill="#ffffff" fill-opacity="0.1" />

      <path d="M 475 405 Q 512 390 549 405" stroke-width="14" />
      <path d="M 330 410 L 275 390" stroke-width="10" />
      <path d="M 694 410 L 749 390" stroke-width="10" />
    </g>

    <g class="avatar-layer-features" fill="#111118" stroke="#111118" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 350 335 Q 400 315 450 335" stroke-width="10" fill="none" />
      <path d="M 574 335 Q 624 315 674 335" stroke-width="10" fill="none" />
      <path d="M 360 332 L 372 320 M 385 330 L 397 318 M 410 330 L 422 318" stroke-width="5" />
      <path d="M 584 332 L 596 320 M 609 330 L 621 318 M 634 330 L 646 318" stroke-width="5" />

      <g class="avatar-eye avatar-eye--left">
        <ellipse cx="402" cy="420" rx="16" ry="19" fill="#111118" />
        <circle cx="408" cy="413" r="6" fill="#ffffff" />
        <path d="M 365 400 Q 402 385 440 400" stroke-width="8" fill="none" />
      </g>

      <g class="avatar-eye avatar-eye--right">
        <ellipse cx="622" cy="420" rx="16" ry="19" fill="#111118" />
        <circle cx="628" cy="413" r="6" fill="#ffffff" />
        <path d="M 584 400 Q 622 385 660 400" stroke-width="8" fill="none" />
      </g>

      <path d="M 505 415 Q 520 465 495 485 Q 512 495 529 485" stroke-width="8" fill="none" />

      <path d="M 432 530 Q 512 565 592 530" stroke-width="12" fill="none" />
      <path d="M 425 528 Q 432 538 428 522" stroke-width="7" fill="none" />
      <path d="M 599 528 Q 592 538 596 522" stroke-width="7" fill="none" />
      <path d="M 465 560 Q 512 575 559 560" stroke-width="7" fill="none" />
    </g>

    <g class="avatar-layer-blush">
      <path d="M 340 490 L 355 510 M 360 488 L 375 508 M 380 488 L 395 508" stroke="#FF2D20" stroke-width="7" stroke-linecap="round" />
      <path d="M 629 490 L 644 510 M 649 488 L 664 508 M 669 488 L 684 508" stroke="#FF2D20" stroke-width="7" stroke-linecap="round" />
    </g>
  </g>
</svg>
